common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"

preprocess:
    lidar_type: 1                #1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for L515 LiDAR
    scan_line: 6
    blind: 0.5
    point_filter_num: 3
    calib_laser: false              # true for KITTI Odometry dataset

mapping:
    down_sample_size: 0.5
    max_iteration: 3

    voxel_size: 3.0
    max_layer: 4
    plannar_threshold: 0.01

    max_points_size: 1000
    max_root_points_size: 2000
    layer_point_size: [5, 5, 5, 5, 5]
    update_size_threshold: 5

    update_inlier_distance_threshold: 0.3
    
    reinit_size_vec: [100, 200, 300, 500, 700, 1000]
    
    lru_cache_capacity: 120000

ransac:
    ransac_max_iter: 10
    ransac_sample_num: 4
    ransac_inlier_distance_threshold: 0.3
    ransac_isplane_p_threshold: 0.8
    sample_seed: 42

valid_check:
    max_layer: 0
    min_points_size: 5
    resolution: 4

noise_model:
    ranging_cov: 0.02 # from fastlivo2
    angle_cov: 0.05
    acc_cov_scale: 0.5
    gyr_cov_scale: 0.3

imu:
    imu_en: true
    extrinsic_T: [ 0.04165, 0.02326, -0.0284]
    extrinsic_R: [ 1, 0, 0, 
                   0, 1, 0, 
                   0, 0, 1]

visualization:
    pub_voxel_map: false
    pub_max_voxel_layer: 4         # only publish 0,1,2 layer's plane
    pub_point_cloud: true
    dense_map_enable: true
    pub_point_cloud_skip: 1             # publish one points per five points

    pub_effect: false

    pub_all_plane_enable: false
    pub_all_plane_layer_color_enable: false
    pub_all_point_enable: false