# Unified Hesai outdoor config for R-VoxelMap
common:
    lid_topic:  "/lidar_points"
    imu_topic:  "/fvs/imu_raw"

preprocess:
    lidar_type: 6                # HESAIxt32 (x,y,z,intensity,timestamp,ring)
    scan_line: 128
    blind: 1
    point_filter_num: 1
    calib_laser: false

mapping:
    down_sample_size: 1.0
    max_iteration: 3
    voxel_size: 2.0
    max_layer: 1
    plannar_threshold: 0.01
    max_points_size: 300
    max_root_points_size: 1000
    layer_point_size: [5, 5, 5, 5, 5]
    update_size_threshold: 5
    update_inlier_distance_threshold: 0.2
    reinit_size_vec: [100, 200, 300, 500, 700, 1000]
    lru_cache_capacity: 120000

ransac:
    ransac_max_iter: 20
    ransac_sample_num: 4
    ransac_inlier_distance_threshold: 0.2
    ransac_isplane_p_threshold: 0.6
    sample_seed: 42

valid_check:
    max_layer: 0
    min_points_size: 20
    resolution: 4

noise_model:
    ranging_cov: 0.04
    angle_cov: 0.1
    acc_cov_scale: 1.0
    gyr_cov_scale: 0.5

imu:
    imu_en: true
    extrinsic_T: [0.022846, -0.005619,  0.08427 ]
    extrinsic_R: [-0.012887,  0.693026,  0.720798,
                   -0.999874,  -0.015618,  -0.00286,
                   0.009275,  -0.720744,  0.69314]

visualization:
    pub_voxel_map: false
    pub_max_voxel_layer: 1
    pub_point_cloud: true
    dense_map_enable: true
    pub_point_cloud_skip: 1
    pub_effect: false
    pub_all_plane_enable: false
    pub_all_plane_layer_color_enable: false
    pub_all_point_enable: false
    pub_grid_map_enable: false
